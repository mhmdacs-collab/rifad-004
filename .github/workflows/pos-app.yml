name: POS application

on:
  push:
    paths:
      - "apps/pos/**"
      - ".github/workflows/pos-app.yml"
  pull_request:
    paths:
      - "apps/pos/**"
      - ".github/workflows/pos-app.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

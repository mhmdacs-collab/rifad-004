name: UI manifest integrity

on:
  pull_request:
    paths:
      - "docs/ui/**"
      - "docs/research/loyverse/**"
      - "tests/ui/**"
      - ".github/workflows/ui-manifest-integrity.yml"
  push:
    branches: [main]
    paths:
      - "docs/ui/**"
      - "docs/research/loyverse/**"
      - "tests/ui/**"
      - ".github/workflows/ui-manifest-integrity.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate UI manifest references and gates
        run: node tests/ui/validate-ui-manifest.mjs
